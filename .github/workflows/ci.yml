name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  sync-check:
    name: Branch up-to-date check
    # Skip on direct pushes to main — HEAD is always up to date with itself
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch main
        run: git fetch origin main
      - name: check behind
        run: |
          behind=$(git rev-list --left-right --count origin/main...HEAD | awk '{print $1}')
          echo "behind=$behind"
          if [ "$behind" -ne 0 ]; then
            echo "Branch is behind main by $behind commit(s); merge latest main before proceeding.";
            exit 1
          fi

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    needs: sync-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py3.11-poetry-${{ hashFiles('poetry.lock') }}-lint
          restore-keys: |
            ${{ runner.os }}-py3.11-poetry-

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run pre-commit (all files)
        run: poetry run pre-commit run --all-files

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Export project requirements
        run: poetry export --with dev --without-hashes --format=requirements.txt --output=requirements-audit.txt

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run bandit (static analysis)
        run: |
          if find src -name "*.py" 2>/dev/null | grep -q .; then
            bandit -r src -ll
          else
            echo "No Python source files in src/ — skipping bandit."
          fi

      - name: Run pip-audit (project dependency CVE scan)
        id: pip-audit
        run: pip-audit --desc -r requirements-audit.txt
        continue-on-error: true

      - name: Note pip-audit result
        if: steps.pip-audit.outcome == 'failure'
        run: |
          echo "::warning::pip-audit reported dependency CVEs. See job log. Tracked separately — does not block merges."

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py3.11-poetry-${{ hashFiles('poetry.lock') }}-test
          restore-keys: |
            ${{ runner.os }}-py3.11-poetry-

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: |
          if find tests -name "test_*.py" | grep -q .; then
            poetry run pytest -q --tb=short
          else
            echo "No test files found — skipping pytest."
          fi

      - name: Open GitHub issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = `CI: tests failed on ${context.ref.replace('refs/heads/','')} (${context.sha.slice(0,7)})`;
            const body = [
              `Automated CI detected failing tests for commit ${context.sha}.`,
              ``,
              `**Branch:** \`${context.ref}\``,
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure'],
            });

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore
