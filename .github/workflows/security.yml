name: Scheduled Security Scan

on:
  schedule:
    # Once daily at 06:00 UTC — CVE feeds update at most daily
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Export requirements from lockfile
        run: poetry export --with dev --without-hashes --format=requirements.txt --output=requirements-audit.txt

      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"

      - name: Audit dependencies
        run: pip-audit --desc -r requirements-audit.txt

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install "bandit==1.7.10"

      - name: Run bandit
        run: |
          if find src -name "*.py" 2>/dev/null | grep -q .; then
            bandit -r src -ll -f json -o bandit-report.json 2>&1 | tee /dev/stderr
          else
            echo "No Python source files in src/ — skipping."
          fi

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
