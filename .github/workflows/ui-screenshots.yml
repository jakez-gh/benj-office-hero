name: UI Screenshots

# Captures admin-web screenshots for every PR that touches the UI, uploads
# them as a workflow artifact, and on push to main commits any refreshed
# screenshots back to docs/screenshots/admin-web/ so the in-repo documentation
# stays in sync with the rendered UI.

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "packages/api-client/**"
      - "packages/types/**"
      - ".github/workflows/ui-screenshots.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/admin-web/**"
      - "packages/api-client/**"
      - "packages/types/**"
      - ".github/workflows/ui-screenshots.yml"

jobs:
  capture:
    name: Capture admin-web screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/admin-web
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config (apps/admin-web/playwright.config.ts) starts
      # `pnpm run dev` and waits for http://localhost:3000 before tests execute, so
      # this job does not need to launch the dev server separately. Two owners
      # would collide on port 3000 (especially under CI=true where
      # reuseExistingServer is false).
      - name: Capture screenshots
        working-directory: apps/admin-web
        env:
          SCREENSHOT_DIR: screenshots
        run: npx playwright test src/e2e/screenshots.spec.ts --reporter=line --project=chromium

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-screenshots
          path: apps/admin-web/screenshots/
          if-no-files-found: error
          retention-days: 30

      # PR-only: post a single sticky comment listing the artifact link so reviewers can grab the rendered UI without leaving the PR.
      - name: Comment on PR with screenshot artifact link
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ui-screenshots
          message: |
            ### UI screenshots refreshed

            Captured screenshots for this PR. Download the `admin-web-screenshots` artifact from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to review.

            Routes captured (desktop 1280×800 + mobile 375×812):
            - `/` (login)
            - `/jobs`
            - `/dispatch`
            - `/vehicles`
            - `/users`

      # Main-only: copy fresh screenshots into docs/screenshots/admin-web/ and commit if anything changed.
      # Uses [skip ci] in the message so this commit doesn't re-trigger the workflow.
      - name: Refresh docs/screenshots/admin-web on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots/admin-web
          rsync -av --delete apps/admin-web/screenshots/ docs/screenshots/admin-web/
          if [ -z "$(git status --porcelain docs/screenshots/admin-web)" ]; then
            echo "No screenshot changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/admin-web
          git commit -m "docs(screenshots): refresh admin-web screenshots [skip ci]

          Auto-generated by ui-screenshots workflow on commit ${{ github.sha }}."
          git push
