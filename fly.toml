# Fly.io configuration for Office Hero Admin Web (React SPA)
#
# No secrets required — the app is a static site served via 'serve'.
# VITE_API_BASE_URL is baked in at build time (see Dockerfile).

app = "office-hero-admin-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  VITE_API_BASE_URL = "https://api.office-hero.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
